# Системный nginx хоста: единая публичная точка входа.
#   /      -> frontend-контейнер (127.0.0.1:5174)
#   /api/  -> backend-контейнер  (127.0.0.1:9000), префикс /api срезается
# Установка: см. deploy/README.md

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 155-212-219-107.sslip.io;

    client_max_body_size 5m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        proxy_pass http://127.0.0.1:9000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # live-поиск и LLM-обогащение могут отвечать долго
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:5174;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
