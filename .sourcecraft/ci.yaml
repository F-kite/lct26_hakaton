on:
  pull_request:
    - workflows: [ci]
      filter:
        target_branches: ["main"]

  push:
    - workflows: [ci]
      filter:
        branches: ["main"]

workflows:
  ci:
    tasks:
      - name: backend-check
        cubes:
          - name: syntax
            image: docker.io/library/python:3.12-slim
            script:
              - python -m compileall -q backend/app RSS-collector/collector

      - name: frontend-check
        cubes:
          - name: lint-and-build
            image: docker.io/library/node:22-alpine
            script:
              - apk add --no-cache git
              - cd frontend && npm ci && npm run lint && npm run build
