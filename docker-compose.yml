name: rss-collector

# journald: логи переживают пересоздание контейнера (docker compose up/down),
# ротацию делает systemd-journald. Читать: docker logs <контейнер> или
# journalctl CONTAINER_NAME=rss-collector-backend-1
# journald есть только на Linux с systemd — на Docker Desktop (Windows/macOS)
# задайте в .env: LOG_DRIVER=json-file
x-logging: &default-logging
  driver: "${LOG_DRIVER:-journald}"
  options:
    tag: "{{.Name}}"

services:
  db:
    logging: *default-logging
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: signals
      POSTGRES_PASSWORD: signals
      POSTGRES_DB: signals
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signals"]
      interval: 5s
      retries: 10
  
  # adminer:
  #   image: adminer
  #   logging: *default-logging
  #   ports:
  #     - "8080:8080"
  #   depends_on:
  #     db:
  #       condition: service_healthy

  collector:
    build: ./RSS-collector
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://signals:signals@db:5432/signals
    dns:
      - 1.1.1.1
      - 8.8.8.8
    command: >
      sh -c "python -m collector.main init &&
             python -m collector.main loop --interval 1800"
    restart: unless-stopped

  backend:
    build: ./backend
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://signals:signals@db:5432/signals
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:3b
      # localhost:5173 — vite dev-сервер, localhost:5174 — фронтенд в Docker
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:5173,http://localhost:5174}
      # необязательные — поднимают лимиты live-поиска, без них тоже работает
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      SEMANTIC_SCHOLAR_API_KEY: ${SEMANTIC_SCHOLAR_API_KEY:-}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-team@example.com}
      # итоговый вывод по ТОП-15 через GigaChat; без ключа блок вывода отключён
      GIGACHAT_AUTH_KEY: ${GIGACHAT_AUTH_KEY:-}
      GIGACHAT_SCOPE: ${GIGACHAT_SCOPE:-GIGACHAT_API_PERS}
      GIGACHAT_MODEL: ${GIGACHAT_MODEL:-GigaChat-3-Ultra}
      GIGACHAT_CA_FILE: /certs/russian_trusted_root_ca.pem
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-240}
    volumes:
      # корневой сертификат НУЦ Минцифры для TLS к API GigaChat
      - ./certs:/certs:ro
    ports:
      - "127.0.0.1:9000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # на сервере задаётся в .env как /api (запросы идут через nginx хоста)
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:9000}
    logging: *default-logging
    depends_on:
      - backend
    ports:
      - "127.0.0.1:5174:80"
    restart: unless-stopped

  ollama:
    image: ollama/ollama
    logging: *default-logging
    volumes:
      # веса модели (~1.9 ГБ на qwen2.5:3b) — сохраняются в volume, повторный
      # docker compose up ничего заново не качает
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "ollama serve &
       sleep 3
       ollama pull qwen2.5:3b
       wait"
    restart: unless-stopped

volumes:
  pgdata:
  ollama_data:
